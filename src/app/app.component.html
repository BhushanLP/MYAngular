            </header>
            <div><app-user-input /></div>
            <br>
            <app-investment-results ></app-investment-results>

                        <app-user></app-user>
                    </li>
                </ul>
            </main>
        </div>
        <div class="col-6">
            <app-tasks [userId]="selectedUser.id"></app-tasks>

        </div>
